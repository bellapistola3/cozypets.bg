name: social_hulk
description: "AI-Powered Social Media Growth Assistant"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  cloud_functions: ^4.6.0
  firebase_analytics: ^10.8.0
  google_mobile_ads: ^3.1.0
  in_app_purchase: ^3.1.11
  http: ^1.1.2
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  google_generative_ai: ^0.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/
